name: Weekly release fetch

on:
  # Scheduled trigger disabled: this Mac runs scripts/local_fetch.sh on
  # a launchd schedule (Fri/Sat/Sun at noon) using its residential IP,
  # which Cloudflare doesn't block on Metal Archives. GitHub Actions
  # IPs are blanket-blocked by MA's Cloudflare and would only push
  # stripped-down data — overwriting the locally-enriched commits.
  # Kept manually-triggerable for emergencies / debugging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch this week
        env:
          SCRAPINGANT_KEY: ${{ secrets.SCRAPINGANT_KEY }}
        run: python scripts/fetch_releases.py

      - name: Fetch upcoming week (preview)
        env:
          SCRAPINGANT_KEY: ${{ secrets.SCRAPINGANT_KEY }}
        run: |
          NEXT=$(python -c "from datetime import date,timedelta; t=date.today(); f=t-timedelta(days=(t.weekday()-4)%7); print((f+timedelta(days=7)).isoformat())")
          python scripts/fetch_releases.py --week-of "$NEXT" --no-ma-enrich

      - name: Commit if changed
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet -- data/; then
            git commit -m "data: refresh releases for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
