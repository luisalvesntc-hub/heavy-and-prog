name: Weekly release fetch

on:
  schedule:
    # Fridays 22:00 UTC — gives sources the full Friday to publish before we read.
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch this week
        run: python scripts/fetch_releases.py

      - name: Fetch upcoming week (preview)
        run: |
          NEXT=$(python -c "from datetime import date,timedelta; t=date.today(); f=t-timedelta(days=(t.weekday()-4)%7); print((f+timedelta(days=7)).isoformat())")
          python scripts/fetch_releases.py --week-of "$NEXT"

      - name: Commit if changed
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet -- data/; then
            git commit -m "data: refresh releases for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
